---
# --- setup -------------------------------------------------------------------

- name: Define paths for {{ backup_mode }}
  ansible.builtin.set_fact:
    backup_parent_dir: "{{ backup_base_dir }}/backup-{{ backup_mode }}"

- name: Create backup parent directory for {{ backup_mode }}
  ansible.builtin.file:
    path: "{{ backup_parent_dir }}"
    state: directory
    mode: "0775"
    owner: "{{ 'postgres' if _deployment_method == 'rpm' else omit }}"

# --- backup ------------------------------------------------------------------

- name: Build backup command for {{ backup_mode }}
  ansible.builtin.set_fact:
    backup_cmd_line: >-
      {{
        (
          [_maintainer, 'backup', backup_mode, '-y']
          + _backup_option_flags
          + [backup_parent_dir]
        ) | join(' ')
        if _deployment_method == 'rpm'
        else (
          [_deployer, 'backup']
          + _backup_option_flags
          + _backup_target_host_flags
          + [backup_parent_dir]
        ) | join(' ')
      }}

- name: Run backup for {{ backup_mode }}
  ansible.builtin.command:
    cmd: "{{ backup_cmd_line }}"
  environment:
    TZ: UTC
    LANG: en_US.utf-8
  register: backup_cmd
  changed_when: true
  ignore_errors: true

- name: Show backup output for {{ backup_mode }}
  ansible.builtin.debug:
    var: backup_cmd.stdout_lines

- name: Fail after backup failure for {{ backup_mode }}
  ansible.builtin.fail:
    msg: "Backup for {{ backup_mode }} failed"
  when: backup_cmd is failed

- name: Calculate backup duration for {{ backup_mode }}
  ansible.builtin.set_fact:
    backup_cmd_duration: >-
      {{
        (backup_cmd.end | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp()
        - (backup_cmd.start | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp()
      }}

- name: Print backup duration for {{ backup_mode }}
  ansible.builtin.debug:
    msg: >-
      Backup{{ backup_mode | capitalize }}{{ backup_metric_suffix }}{{ backup_metric_role_suffix_effective }}
      {{ backup_cmd.start }} to {{ backup_cmd.end }}
      taking {{ backup_cmd_duration }} seconds

# --- restore -----------------------------------------------------------------

- name: Restore backup for {{ backup_mode }}
  when: backup_run_restore | d(false) | bool
  block:
    - name: Find backup subdirectories for {{ backup_mode }}
      ansible.builtin.find:
        paths: "{{ backup_parent_dir }}"
        file_type: directory
        depth: 1
      register: backup_subdir_find

    - name: Assert a backup subdirectory exists for {{ backup_mode }}
      ansible.builtin.assert:
        that:
          - backup_subdir_find.matched > 0
        fail_msg: "No backup subdirectory found under {{ backup_parent_dir }}"

    - name: Set latest backup directory for {{ backup_mode }}
      ansible.builtin.set_fact:
        backup_latest_dir: "{{ backup_subdir_find.files | map(attribute='path') | sort | last }}"

    - name: Build restore validate command for {{ backup_mode }}
      ansible.builtin.set_fact:
        backup_restore_validate_cmd_line: >-
          {{
            ([_restore_command, 'restore', backup_latest_dir]
             + _restore_target_host_flags
             + _restore_validate_option_flags) | join(' ')
          }}
      when: backup_restore_validate | d(true) | bool

    - name: Validate backup before restore for {{ backup_mode }}
      ansible.builtin.command:
        cmd: "{{ backup_restore_validate_cmd_line }}"
      environment:
        TZ: UTC
        LANG: en_US.utf-8
      register: backup_restore_validate_cmd
      changed_when: false
      ignore_errors: true
      when: backup_restore_validate | d(true) | bool

    - name: Show restore validate output for {{ backup_mode }}
      ansible.builtin.debug:
        var: backup_restore_validate_cmd.stdout_lines
      when: backup_restore_validate | d(true) | bool

    - name: Fail after restore validate failure for {{ backup_mode }}
      ansible.builtin.fail:
        msg: "Restore validate for {{ backup_mode }} failed"
      when:
        - backup_restore_validate | d(true) | bool
        - backup_restore_validate_cmd is failed

    - name: Build restore command for {{ backup_mode }}
      ansible.builtin.set_fact:
        backup_restore_cmd_line: >-
          {{
            ([_restore_command, 'restore']
             + _restore_prefix_flags
             + [backup_latest_dir]
             + _restore_target_host_flags
             + _restore_option_flags) | join(' ')
          }}

    - name: Restore from latest backup for {{ backup_mode }}
      ansible.builtin.command:
        cmd: "{{ backup_restore_cmd_line }}"
      environment:
        TZ: UTC
        LANG: en_US.utf-8
      register: backup_restore_cmd
      changed_when: true
      ignore_errors: true

    - name: Show restore output for {{ backup_mode }}
      ansible.builtin.debug:
        var: backup_restore_cmd.stdout_lines

    - name: Fail after restore failure for {{ backup_mode }}
      ansible.builtin.fail:
        msg: "Restore for {{ backup_mode }} failed"
      when: backup_restore_cmd is failed

    - name: Calculate restore duration for {{ backup_mode }}
      ansible.builtin.set_fact:
        backup_restore_cmd_duration: >-
          {{
            (backup_restore_cmd.end | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp()
            - (backup_restore_cmd.start | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp()
          }}

    - name: Print restore duration for {{ backup_mode }}
      ansible.builtin.debug:
        msg: >-
          Restore{{ backup_mode | capitalize }}{{ backup_metric_suffix }}{{ backup_metric_role_suffix_effective }}
          {{ backup_restore_cmd.start }} to {{ backup_restore_cmd.end }}
          taking {{ backup_restore_cmd_duration }} seconds

# --- cleanup -----------------------------------------------------------------

- name: Cleanup backup parent directory for {{ backup_mode }}
  ansible.builtin.file:
    path: "{{ backup_parent_dir }}"
    state: absent
  when: backup_cleanup | d(false) | bool
