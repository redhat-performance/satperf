---
- name: Apply PRs
  hosts: satellite6:capsules:capsule_lbs
  gather_facts: false

  tasks:
    - name: Apply PRs
      when:
        - apply_prs_deployer is defined
        - apply_prs_deployer is string or apply_prs_deployer.targets | default([]) | length > 0
      ansible.builtin.include_role:
        name: apply_prs
      vars:
        apply_prs: "{{ apply_prs_deployer }}"
...
