---
# Aliases for deployment facts (set by tasks/deployment_method/inherit).
_haproxy_registration_port: "{{ _registration_proxy_port }}"
_haproxy_templates_port: "{{ _templates_proxy_port }}"

# Registration frontend/backend tuning (see haproxy.cfg.j2).
#
# Default fall is 9999 (effectively never) to prevent load-induced false failover
# during stress tests — a capsule under heavy registration load may fail the
# /register/health check transiently even though it is still functioning.
# Removing it from rotation would concentrate load on the remaining capsules
# and cause cascading failures.
#
# Set _haproxy_registration_fall to 3 for production-grade failover (removes
# capsule after ~90s of consecutive failures at the default 30s check interval).
_haproxy_registration_fall: 9999

# Registration requests can take minutes under high concurrency because the
# capsule waits for Satellite to render the registration template. The default
# HAProxy timeout client/server of 1m/150s is too short — hosts disconnect
# before the capsule can respond, producing SSL_read errors.
_haproxy_registration_timeout_client: 5m
_haproxy_registration_timeout_server: 5m

# Maximum concurrent connections per capsule backend in the host_registration
# backend. Queues excess connections at the LB instead of flooding capsules.
# Set to 0 to disable (no per-server limit).
_haproxy_registration_maxconn: 500
