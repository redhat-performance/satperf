---
- name: Gather installed package facts
  ansible.builtin.package_facts:

- name: Determine installed deployer/installer package
  # satellitectl depends on (and installs alongside) foremanctl, and
  # satellite-installer likewise wraps foreman-installer, so a Satellite
  # host has both of its pair installed at once - list from most to least
  # product-specific and take the first match, rather than requiring
  # exactly one to be present.
  ansible.builtin.set_fact:
    _deployer: >-
      {{ 'satellitectl' if 'satellitectl' in ansible_facts.packages
         else 'satellite-installer' if 'satellite-installer' in ansible_facts.packages
         else 'foremanctl' if 'foremanctl' in ansible_facts.packages
         else 'foreman-installer' if 'foreman-installer' in ansible_facts.packages
         else none }}

- name: Assert a known deployer/installer package is installed
  ansible.builtin.assert:
    that:
      - _deployer is not none
    fail_msg: >-
      Expected one of satellitectl/satellite-installer/foremanctl/foreman-installer
      to be installed, found none of those among installed packages.

- name: Determine deployment method
  ansible.builtin.set_fact:
    _deployment_method: >-
      {{ 'container' if _deployer in ['foremanctl', 'satellitectl'] else 'rpm' }}
