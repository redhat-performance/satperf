---
- ansible.builtin.include_tasks: ../../tasks/deployment_method/inherit.yaml
  when: foremanctl_deployment_type == 'proxy'

- name: Set deployment facts for server install
  when: foremanctl_deployment_type == 'server'
  block:
    - ansible.builtin.set_fact:
        _deployer: "{{ foremanctl_deployer }}"
        _deployment_method: container

    - ansible.builtin.include_tasks: ../../tasks/deployment_method/set_derived_facts.yaml

- name: Requirements
  block:
    - name: Foreman
      when:
        - _is_foreman_product | bool
      block:
        - name: Assert required Foreman facts
          ansible.builtin.assert:
            that:
              - foreman_version is defined and foreman_version | length > 0
              - katello_version is defined and katello_version | length > 0
              - foreman_version == 'nightly' or foreman_version is ansible.builtin.version('5.0', '>=')
              - katello_version == 'nightly' or katello_version is ansible.builtin.version('5.0', '>=')
            fail_msg: >-
              foreman_version and katello_version must be set to nightly or >= 5.0

        - name: Setup Foreman repositories
          ansible.builtin.include_role:
            name: theforeman.operations.foreman_repositories
          vars:
            foreman_repositories_version: "{{ foreman_version }}"
            foreman_repositories_katello_version: "{{ katello_version }}"

    - name: Satellite
      when:
        - _is_satellite_product | bool
      block:
        # XXX: HACK! satellitectl (containerized) only ships in the "satellite"
        # repo, so force proxies onto satellite6's additional_repos too.
        - name: Use satellite6's additional_repos for containerized proxies
          # lookup('ansible.builtin.vars', ..., host=...) still resolves in the
          # current host's context; hostvars templates in the source host's pantry.
          ansible.builtin.set_fact:
            additional_repos: "{{ hostvars[groups['satellite6'][0]].additional_repos }}"
          when:
            - foremanctl_deployment_type is defined and foremanctl_deployment_type == 'proxy'

        - name: Setup Satellite repositories
          ansible.builtin.include_role:
            name: repo_setup

- name: Install deployer package
  ansible.builtin.dnf:
    name: "{{ _deployer }}"
    state: latest

- name: Apply PRs
  when:
    - apply_prs is defined
    - apply_prs is string or apply_prs.targets | default([]) | length > 0
  ansible.builtin.include_role:
    name: apply_prs

- name: Red Hat registry
  when:
    - registry is defined and registry != "quay.io"
    - registry_username is defined and registry_username | length > 0
    - registry_password is defined and registry_password | length > 0
  block:
    - name: Log in to the registry
      containers.podman.podman_login:
        registry: "{{ registry }}"
        username: "{{ registry_username }}"
        password: "{{ registry_password }}"
        authfile: /etc/foreman/registry-auth.json

    - name: Redirect pulls to a different registry
      when: registry != "registry.redhat.io"
      block:
        - name: Redirect registry.redhat.io pulls to the configured registry
          ansible.builtin.copy:
            dest: /etc/containers/registries.conf.d/registry-mirror.conf
            mode: '0644'
            content: |
              [[registry]]
              prefix = "registry.redhat.io"
              location = "{{ registry }}"

        - name: Check for an existing local container signature policy
          ansible.builtin.stat:
            path: /etc/containers/policy.json
          register: _foremanctl_local_policy_json

        - name: Relax signature policy for registry.redhat.io
          vars:
            _foremanctl_policy_json_src: >-
              {{ '/etc/containers/policy.json' if _foremanctl_local_policy_json.stat.exists
                 else '/usr/share/containers/policy.json' }}
          block:
            - name: Read active container signature policy
              ansible.builtin.slurp:
                src: "{{ _foremanctl_policy_json_src }}"
              register: _foremanctl_active_policy_json

            - name: Write /etc/containers/policy.json with registry.redhat.io relaxed
              ansible.builtin.copy:
                dest: /etc/containers/policy.json
                mode: '0644'
                content: >-
                  {{ (_foremanctl_active_policy_json.content | b64decode | from_json)
                     | combine({'transports': {'docker': {
                         'registry.redhat.io': [{'type': 'insecureAcceptAnything'}]}}},
                               recursive=true)
                     | to_nice_json }}

    - name: Set IOP engine extra packages
      when:
        - enable_iop | d(false) | bool
        - iop_engine_extra_packages is defined and iop_engine_extra_packages | length > 0
      ansible.builtin.blockinfile:
        path: /usr/share/foremanctl/src/vars/images.yml
        marker: "# {mark} SATPERF iop_engine_extra_packages"
        block: |
          iop_engine_extra_packages:
          {% for package in iop_engine_extra_packages.split(',') %}
            - "{{ package }}"
          {% endfor %}

# - name: Show images.yml content
#   ansible.builtin.slurp:
#     src: /usr/share/foremanctl/src/vars/images.yml
#   register: _foremanctl_images_yml

# - name: Display images.yml
#   ansible.builtin.debug:
#     msg: "{{ (_foremanctl_images_yml.content | b64decode).split('\n') }}"

- name: Pull images
  when:
    - foremanctl_deployment_type == 'server'
  block:
    - name: Set command line to pull images
      ansible.builtin.set_fact:
        _foremanctl_pull_images_cmd: "{{ _deployer }} pull-images"

    - name: Show command line to pull images
      ansible.builtin.debug:
        msg: "{{ _foremanctl_pull_images_cmd }}"

    - name: Pull images
      ansible.builtin.command:
        cmd: "{{ _foremanctl_pull_images_cmd }}"
      register: _foremanctl_pull_images_cmd_out
      # XXX: Ignore errors in order to be able to show `_foremanctl_pull_images_cmd_out.stdout_lines`
      ignore_errors: true
      changed_when: true

    - name: Show pull images output
      ansible.builtin.debug:
        var: _foremanctl_pull_images_cmd_out.stdout_lines
      failed_when:
        - _foremanctl_pull_images_cmd_out is failed

    - name: Show pull images error output
      ansible.builtin.debug:
        var: _foremanctl_pull_images_cmd_out.stderr_lines
      failed_when:
        - _foremanctl_pull_images_cmd_out is failed

- name: Foreman server deployment
  when:
    - foremanctl_deployment_type == 'server'
  block:
    - name: Set command line to deploy
      ansible.builtin.set_fact:
        _foremanctl_deploy_cmd: "{{ _deployer }} deploy"

    - name: Initial deployment
      block:
        - name: Set basic deployment command line
          ansible.builtin.set_fact:
            _foremanctl_initial_deploy_cmd: >-
              {{ [_foremanctl_deploy_cmd,
                  '--initial-admin-password ' ~ (password | default(foreman_password)),
                  '--flavor satellite' if _is_satellite_product | bool else '']
                 | reject('equalto', '') | join(' ') }}

        - name: Set redacted basic deployment command line
          ansible.builtin.set_fact:
            _foremanctl_initial_deploy_cmd_redacted: >-
              {{ [_foremanctl_deploy_cmd,
                  '--initial-admin-password [redacted]',
                  '--flavor satellite' if _is_satellite_product | bool else '']
                 | reject('equalto', '') | join(' ') }}

        - name: Show redacted deployment command line
          ansible.builtin.debug:
            msg: "{{ _foremanctl_initial_deploy_cmd_redacted }}"

        - name: Run deployment
          ansible.builtin.command:
            cmd: "{{ _foremanctl_initial_deploy_cmd }}"
          register: _foremanctl_initial_deploy_cmd_out
          # XXX: failed_when false (rather than ignore_errors/no_log) so Ansible never marks
          # this task itself as failed - a failed task prints its full, uncensored result
          # (including the raw admin password embedded in cmd) via Ansible's own fatal-task
          # echo, and no_log would instead wipe out stdout_lines/stderr_lines needed below.
          failed_when: false
          changed_when: true

        - name: Show deployment return code
          ansible.builtin.debug:
            var: _foremanctl_initial_deploy_cmd_out.rc

        - name: Show deployment output
          ansible.builtin.debug:
            var: _foremanctl_initial_deploy_cmd_out.stdout_lines

        - name: Show deployment error output
          ansible.builtin.debug:
            var: _foremanctl_initial_deploy_cmd_out.stderr_lines

        - name: Assert deployment succeeded
          ansible.builtin.assert:
            that:
              - _foremanctl_initial_deploy_cmd_out.rc == 0
            fail_msg: "foremanctl deploy failed (rc={{ _foremanctl_initial_deploy_cmd_out.rc }}); see output above"
            success_msg: foremanctl deploy succeeded

        - name: Calculate deployment duration
          ansible.builtin.set_fact:
            _foremanctl_deploy_duration: >-
              {{ (_foremanctl_initial_deploy_cmd_out.end | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp()
                 - (_foremanctl_initial_deploy_cmd_out.start | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp() }}

        - name: Show deployment duration
          ansible.builtin.debug:
            msg: >-
              ForemanctlDeploy {{ _foremanctl_initial_deploy_cmd_out.start }}
              to {{ _foremanctl_initial_deploy_cmd_out.end }}
              taking {{ _foremanctl_deploy_duration }} seconds

    - name: Add/remove features
      block:
        - name: Add iop to features if enabled
          when: enable_iop | d(false) | bool
          ansible.builtin.set_fact:
            foremanctl_add_features: "{{ (foremanctl_add_features | d([])) + ['iop'] }}"
            # foremanctl_remove_features: "{{ (foremanctl_remove_features | d([])) + ['cloud-connector'] }}"

        - name: Add/remove features deployment
          ansible.builtin.include_tasks: add_remove_features.yaml
          vars:
            _foremanctl_features_deploy_cmd: "{{ _foremanctl_deploy_cmd }}"
            _foremanctl_features_add: "{{ foremanctl_add_features }}"
            _foremanctl_features_remove: "{{ foremanctl_remove_features }}"

- name: Foreman smart proxy deployment
  when:
    - foremanctl_deployment_type == 'proxy'
  block:
    - name: Assert required proxy deployment facts
      ansible.builtin.assert:
        that:
          - groups['satellite6'] is defined and groups['satellite6'] | length > 0

    - name: Set default variable(s) values
      ansible.builtin.set_fact:
        _foremanctl_location_groupname: "location_{{ location | lower }}"

    - name: Load balanced capsule
      when:
        - "'capsule_lbs' in groups"
        - groups['capsule_lbs'] | intersect(groups[_foremanctl_location_groupname]) | length > 0
      ansible.builtin.set_fact:
        _foremanctl_capsule_lb: >-
          {{ groups['capsule_lbs'] | intersect(groups[_foremanctl_location_groupname]) | first }}

    - name: Load balanced capsule URL
      when:
        - _foremanctl_capsule_lb is defined
      ansible.builtin.set_fact:
        # _foremanctl_capsule_lb's smart-proxy consolidates registration/templates/etc.
        # onto its single https_port - see haproxy role and _registration_proxy_port.
        _foremanctl_capsule_lb_url: "https://{{ _foremanctl_capsule_lb }}:{{ _registration_proxy_port }}"

    - name: Set command line to deploy proxy
      ansible.builtin.set_fact:
        _foremanctl_deploy_proxy_cmd: "{{ _deployer }} deploy-proxy"

    - name: Generate proxy auth bundle on the Foreman server
      delegate_to: "{{ groups['satellite6'] | first }}"
      block:
        - name: Set auth bundle command line
          ansible.builtin.set_fact:
            _foremanctl_auth_bundle_cmd: >-
              {{ [_deployer,
                  'auth-bundle',
                  ('--server-alias ' ~ _foremanctl_capsule_lb ~ ' --certificate-renew') if _foremanctl_capsule_lb is defined else '',
                  inventory_hostname]
                 | reject('equalto', '') | join(' ') }}

        - name: Show auth bundle command line
          ansible.builtin.debug:
            msg: "{{ _foremanctl_auth_bundle_cmd }}"

        - name: Generate auth bundle
          ansible.builtin.command:
            cmd: "{{ _foremanctl_auth_bundle_cmd }}"
          register: _foremanctl_auth_bundle_cmd_out
          ignore_errors: true
          changed_when: true

        - name: Show auth bundle output
          ansible.builtin.debug:
            var: _foremanctl_auth_bundle_cmd_out.stdout_lines
          failed_when:
            - _foremanctl_auth_bundle_cmd_out is failed

        - name: Show auth bundle error output
          ansible.builtin.debug:
            var: _foremanctl_auth_bundle_cmd_out.stderr_lines
          failed_when:
            - _foremanctl_auth_bundle_cmd_out is failed

        - name: Read generated auth bundle
          ansible.builtin.slurp:
            src: "{{ foremanctl_proxy_auth_bundle_source_path }}"
          register: _foremanctl_proxy_auth_bundle

    - name: Copy auth bundle to proxy host
      ansible.builtin.copy:
        content: "{{ _foremanctl_proxy_auth_bundle.content | b64decode }}"
        dest: "{{ foremanctl_proxy_auth_bundle_dest_path }}"
        mode: '0600'

    # XXX: Hack
    - name: Ensure proxy inventory target exists
      ansible.builtin.blockinfile:
        path: /etc/foremanctl/inventory
        marker: "# {mark} foremanctl proxy target"
        block: |
          [proxy]
          localhost ansible_connection=local

    - name: Set foreman-proxy-content flavor
      when:
        - _is_foreman_product | bool
      ansible.builtin.set_fact:
        _foremanctl_proxy_flavor: foreman-proxy-content

    - name: Set capsule flavor
      when:
        - _is_satellite_product | bool
      ansible.builtin.set_fact:
        _foremanctl_proxy_flavor: capsule

    - name: Set proxy deployment command line
      ansible.builtin.set_fact:
        _foremanctl_initial_deploy_proxy_cmd: >-
          {{ ([_foremanctl_deploy_proxy_cmd,
               '--flavor ' ~ _foremanctl_proxy_flavor,
               '--auth-bundle ' ~ foremanctl_proxy_auth_bundle_dest_path,
               '--foreman-fqdn ' ~ (groups['satellite6'] | first)]
              + (['--registration-url ' ~ _foremanctl_capsule_lb_url,
                  '--templates-url ' ~ _foremanctl_capsule_lb_url] if _foremanctl_capsule_lb is defined else []))
             | reject('equalto', '') | join(' ') }}

    - name: Show proxy deployment command line
      ansible.builtin.debug:
        msg: "{{ _foremanctl_initial_deploy_proxy_cmd }}"

    - name: Run proxy deployment
      ansible.builtin.command:
        cmd: "{{ _foremanctl_initial_deploy_proxy_cmd }}"
      register: _foremanctl_deploy_proxy_cmd_out
      ignore_errors: true
      changed_when: true

    - name: Show proxy deployment output
      ansible.builtin.debug:
        var: _foremanctl_deploy_proxy_cmd_out.stdout_lines
      failed_when:
        - _foremanctl_deploy_proxy_cmd_out is failed

    - name: Show proxy deployment error output
      ansible.builtin.debug:
        var: _foremanctl_deploy_proxy_cmd_out.stderr_lines
      failed_when:
        - _foremanctl_deploy_proxy_cmd_out is failed

    - name: Calculate proxy deployment duration
      ansible.builtin.set_fact:
        _foremanctl_deploy_proxy_duration: >-
          {{ (_foremanctl_deploy_proxy_cmd_out.end | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp()
             - (_foremanctl_deploy_proxy_cmd_out.start | to_datetime('%Y-%m-%d %H:%M:%S.%f')).timestamp() }}

    - name: Show proxy deployment duration
      ansible.builtin.debug:
        msg: >-
          ForemanctlDeployProxy {{ _foremanctl_deploy_proxy_cmd_out.start }}
          to {{ _foremanctl_deploy_proxy_cmd_out.end }}
          taking {{ _foremanctl_deploy_proxy_duration }} seconds

    - name: Add/remove features deployment
      ansible.builtin.include_tasks: add_remove_features.yaml
      vars:
        _foremanctl_features_deploy_cmd: "{{ _foremanctl_deploy_proxy_cmd }}"
        _foremanctl_features_add: "{{ foremanctl_proxy_add_features }}"
        _foremanctl_features_remove: "{{ foremanctl_proxy_remove_features }}"
...
