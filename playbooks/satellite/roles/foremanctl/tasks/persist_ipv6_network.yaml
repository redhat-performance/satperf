---
# The deployer attaches foreman-core-network-ipv6 at runtime only, so a container
# restart (e.g. apply_prs live-patching) drops it. Pin it into the container's
# quadlet via a drop-in so it survives restarts. Expects _persist_ipv6_container.
- name: Ensure quadlet drop-in dir for {{ _persist_ipv6_container }}
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ _persist_ipv6_container }}.container.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pin the IPv6 network into {{ _persist_ipv6_container }}'s quadlet
  ansible.builtin.copy:
    dest: "/etc/containers/systemd/{{ _persist_ipv6_container }}.container.d/15-satperf-ipv6.conf"
    content: |
      [Container]
      Network=foreman-core-network-ipv6
    owner: root
    group: root
    mode: "0644"
  register: _persist_ipv6_dropin

- name: Reload systemd so the IPv6 drop-in applies on the next restart
  when: _persist_ipv6_dropin is changed
  ansible.builtin.systemd_service:
    daemon_reload: true
...
