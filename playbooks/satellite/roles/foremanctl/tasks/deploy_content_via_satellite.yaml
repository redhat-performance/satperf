---
# Katello rejects docker content uploads via API, so images already present
# locally are pushed via `skopeo copy`; only missing ones sync from the CDN.

- name: Populate deployment content on Satellite
  module_defaults:
    group/theforeman.foreman.foreman:
      server_url: "{{ _server_url }}"
      username: "{{ _username }}"
      password: "{{ _password }}"
      validate_certs: "{{ _validate_certs }}"
      organization: "{{ _organization }}"
  block:
    - name: Load shared FAM connection vars
      ansible.builtin.include_vars: "{{ role_path }}/../../../tests/includes/common_vars.yaml"

    - name: Derive the satellite server's RHEL facts
      ansible.builtin.include_tasks: derive_satellite_rhel_facts.yaml

    - name: Query the satellite server's own enabled repositories
      ansible.builtin.command:
        cmd: subscription-manager repos --list-enabled
      changed_when: false
      register: _foremanctl_satellite_enabled_repos_cmd

    - name: Extract the satellite server's enabled repository-set labels
      ansible.builtin.set_fact:
        _foremanctl_capsule_repo_set_labels: >-
          {{ _foremanctl_satellite_enabled_repos_cmd.stdout
             | regex_findall('Repo ID:\s*(\S+)') }}

    - name: Download a fresh Red Hat subscription manifest
      theforeman.foreman.redhat_manifest:
        validate_certs: "{{ foreman_rhsm_validate_certs }}"
        uuid: "{{ foreman_manifest_uuid }}"
        username: "{{ foreman_rhsm_username }}"
        password: "{{ foreman_rhsm_password }}"
        path: "{{ _foremanctl_manifest_path }}"
      vars:
        _foremanctl_manifest_path: ~/.ansible/tmp/manifest.zip
      register: __foremanctl_manifest_download_result
      until: __foremanctl_manifest_download_result is not failed
      retries: "{{ _api_call_retries }}"
      delay: "{{ _api_call_delay }}"

    - name: Import the Red Hat subscription manifest
      theforeman.foreman.subscription_manifest:
        manifest_path: ~/.ansible/tmp/manifest.zip
      register: __foremanctl_manifest_import_result
      until: __foremanctl_manifest_import_result is not failed
      retries: "{{ _api_call_retries }}"
      delay: "{{ _api_call_delay }}"

    - name: Refresh the Red Hat subscription manifest
      theforeman.foreman.subscription_manifest:
        state: refreshed
      register: __foremanctl_manifest_refresh_result
      until: __foremanctl_manifest_refresh_result is not failed
      retries: "{{ _api_call_retries }}"
      delay: "{{ _api_call_delay }}"

    - name: Enable the satellite server's own repository sets
      # Beta sets have no releasever/basearch variants (enable outright);
      # GA sets do, so filter those by releasever instead.
      theforeman.foreman.repository_set:
        label: "{{ item }}"
        all_repositories: "{{ item is search('-beta-rpms$') }}"
        repositories: >-
          {{ [] if item is search('-beta-rpms$')
             else [{'releasever': _foremanctl_capsule_rhel_major}] }}
        state: enabled
      loop: "{{ _foremanctl_capsule_repo_set_labels }}"
      register: __foremanctl_capsule_rhel_reposet_result
      until: __foremanctl_capsule_rhel_reposet_result is not failed
      retries: "{{ _api_call_retries }}"
      delay: "{{ _api_call_delay }}"

    - name: Look up the enabled RHEL BaseOS/AppStream repositories
      theforeman.foreman.resource_info:
        resource: repositories
        search: "content_label={{ item }}"
      loop: "{{ _foremanctl_capsule_repo_set_labels }}"
      register: __foremanctl_capsule_rhel_repo_info

    - name: Set on-demand download policy for RHEL BaseOS/AppStream repositories
      # Fetch packages lazily instead of mirroring everything upfront.
      theforeman.foreman.repository:
        name: "{{ item.resources[0].name }}"
        product: "{{ item.resources[0].product.name }}"
        content_type: yum
        download_policy: on_demand
        mirroring_policy: mirror_content_only
      loop: "{{ __foremanctl_capsule_rhel_repo_info.results }}"
      loop_control:
        label: "{{ item.resources[0].name }}"
      register: __foremanctl_capsule_rhel_repo_policy_result
      until: __foremanctl_capsule_rhel_repo_policy_result is not failed
      retries: "{{ _api_call_retries }}"
      delay: "{{ _api_call_delay }}"

    - name: Sync RHEL BaseOS/AppStream repositories
      theforeman.foreman.repository_sync:
        product: "{{ item.resources[0].product.name }}"
        repository: "{{ item.resources[0].name }}"
      loop: "{{ __foremanctl_capsule_rhel_repo_info.results }}"
      loop_control:
        label: "{{ item.resources[0].name }}"
      register: __foremanctl_capsule_rhel_repo_sync_result
      until: __foremanctl_capsule_rhel_repo_sync_result is not failed
      retries: "{{ _api_call_retries }}"
      delay: "{{ _api_call_delay }}"

    - name: Mirror the deployer repositories
      # Only needed for pre-release stream/snap testing - a GA
      # satellite-*-rpms repo (covered by the RHSM-sourced sets above)
      # already has the deployer package on its own.
      when: _foremanctl_additional_repos | length > 0
      vars:
        _foremanctl_additional_repos: "{{ additional_repos }}"
      block:
        - name: Resolve the deployer package repo file
          ansible.builtin.uri:
            url: >-
              {{ (_foremanctl_additional_repos | selectattr('from_file', 'defined')
                                                | map(attribute='from_file') | list)[0] }}
            return_content: true
          register: __foremanctl_deployer_repo_file

        - name: Extract the deployer package repo baseurl
          # Re-resolve every run - the redirect target can change per snap.
          ansible.builtin.set_fact:
            _foremanctl_deployer_repo_baseurl: >-
              {{ (__foremanctl_deployer_repo_file.content
                  | regex_search('baseurl\s*=\s*(\S+)', '\1')) | first }}

        - name: Create the deployer package product
          theforeman.foreman.product:
            name: "{{ foremanctl_deployer_product }}"
            label: "{{ foremanctl_deployer_product_label }}"
          register: __foremanctl_deployer_product_result
          until: __foremanctl_deployer_product_result is not failed
          retries: "{{ _api_call_retries }}"
          delay: "{{ _api_call_delay }}"

        - name: Mirror the deployer package repository
          theforeman.foreman.repository:
            product: "{{ foremanctl_deployer_product }}"
            name: "{{ foremanctl_deployer_repo }}"
            label: "{{ foremanctl_deployer_repo_label }}"
            content_type: yum
            url: "{{ _foremanctl_deployer_repo_baseurl }}"
            download_policy: on_demand
          register: __foremanctl_deployer_repo_result
          until: __foremanctl_deployer_repo_result is not failed
          retries: "{{ _api_call_retries }}"
          delay: "{{ _api_call_delay }}"

        - name: Sync the deployer package repository
          theforeman.foreman.repository_sync:
            product: "{{ foremanctl_deployer_product }}"
            repository: "{{ foremanctl_deployer_repo }}"
          register: __foremanctl_deployer_repo_sync_result
          until: __foremanctl_deployer_repo_sync_result is not failed
          retries: "{{ _api_call_retries }}"
          delay: "{{ _api_call_delay }}"

    - name: Publish the Satellite server's own infra container images to mirror
      # Delegates to setup-infra-images (pablomh/foremanctl#46) - no CV/CCV/LCE needed.
      block:
        - name: Trust Satellite's CA bundle for registry TLS
          when: foremanctl_capsule_images_prefer_local_push | bool
          ansible.builtin.include_tasks: trust_satellite_ca.yaml
          vars:
            _foremanctl_trust_ca_for_host: "{{ groups['satellite6'] | first }}"

        - name: Set command line to publish infra container images
          ansible.builtin.set_fact:
            _foremanctl_setup_infra_images_cmd: >-
              {{ [_deployer, 'setup-infra-images',
                  '--organization "' ~ _organization ~ '"',
                  '--air-gapped' if foremanctl_capsule_images_prefer_local_push | bool else '']
                 | reject('equalto', '') | join(' ') }}

        - name: Show command line to publish infra container images
          ansible.builtin.debug:
            msg: "{{ _foremanctl_setup_infra_images_cmd }}"

        - name: Publish infra container images
          ansible.builtin.command:
            cmd: "{{ _foremanctl_setup_infra_images_cmd }}"
          register: _foremanctl_setup_infra_images_cmd_out
          ignore_errors: true
          changed_when: true

        - name: Show publish infra container images output
          ansible.builtin.debug:
            var: _foremanctl_setup_infra_images_cmd_out.stdout_lines
          failed_when:
            - _foremanctl_setup_infra_images_cmd_out is failed

        - name: Show publish infra container images error output
          ansible.builtin.debug:
            var: _foremanctl_setup_infra_images_cmd_out.stderr_lines
          failed_when:
            - _foremanctl_setup_infra_images_cmd_out is failed
...
