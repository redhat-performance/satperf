---
- name: Enable Foreman repositories for foreman-pcp
  ansible.builtin.include_role:
    name: theforeman.operations.foreman_repositories
  when: _deployer in ['foreman-installer', 'foremanctl']
  vars:
    foreman_repositories_version: "{{ foreman_pcp_repositories_version | default('nightly') }}"

- name: Install and configure PCP metrics
  ansible.builtin.include_role:
    name: "{{ foreman_pcp_setup_role }}"

- name: Disable Foreman repositories
  ansible.builtin.dnf:
    name: foreman-release
    state: absent
  when: _deployer in ['foreman-installer', 'foremanctl']
