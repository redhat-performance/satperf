    - name: Allow Jetlag ISO HTTP port through bastion firewalld
      ansible.posix.firewalld:
        port: "8081/tcp"
        permanent: true
        immediate: true
        state: enabled

    - name: Run Jetlag mno-deploy playbook
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PY' {{ jetlag_dest | quote }} {{ jetlag_ansible_playbook | quote }} {{ jetlag_inventory_file | quote }} {{ (jetlag_log_dir ~ "/mno-deploy.log") | quote }} {{ (jetlag_debug_dir ~ "/mno-deploy-monitor.json") | quote }} {{ jetlag_cluster_name | quote }} {{ jetlag_bmc_user | quote }} {{ jetlag_bmc_password | quote }} {{ (groups['cnv_controlplane'] | default([])) | to_json | quote }} {{ (jetlag_effective_controlplane_ips | default({})) | to_json | quote }} {{ jetlag_effective_mno_monitor_interval_seconds | quote }} {{ jetlag_effective_mno_discovery_grace_seconds | quote }} {{ jetlag_assisted_api_base | quote }}
          import json
          import os
          import signal
          import subprocess
          import sys
          import time

          import requests
          import urllib3

          (
              work_dir,
              ansible_playbook,
              inventory_file,
              log_file,
              monitor_file,
              cluster_name,
              bmc_user,
              bmc_password,
              hosts_json,
              ips_json,
              interval_seconds,
              grace_seconds,
              assisted_api_base,
          ) = sys.argv[1:14]

          hosts = json.loads(hosts_json)
          controlplane_ips = json.loads(ips_json)
          interval_seconds = int(interval_seconds)
          grace_seconds = int(grace_seconds)
          urllib3.disable_warnings()

          os.makedirs(os.path.dirname(log_file), exist_ok=True)
          os.makedirs(os.path.dirname(monitor_file), exist_ok=True)

          command = [
              ansible_playbook,
              "-i",
              inventory_file,
              "ansible/mno-deploy.yml",
          ]

          with open(log_file, "w", encoding="utf-8") as logfh:
              proc = subprocess.Popen(
                  command,
                  cwd=work_dir,
                  stdout=logfh,
                  stderr=subprocess.STDOUT,
                  text=True,
              )

              session = requests.Session()
              wait_started_at = None
              monitor_summary = {
                  "command": command,
                  "cluster_name": cluster_name,
                  "monitor_interval_seconds": interval_seconds,
                  "discovery_grace_seconds": grace_seconds,
                  "events": [],
                  "latest_host_states": {},
                  "host_state_history": {host: [] for host in hosts},
              }

              def read_log():
                  try:
                      with open(log_file, encoding="utf-8", errors="replace") as fh2:
                          return fh2.read()
                  except FileNotFoundError:
                      return ""

              def get_cluster_detail():
                  base = assisted_api_base
                  clusters = session.get(f"{base}/clusters", timeout=20).json()
                  for cluster in clusters:
                      if isinstance(cluster, dict) and cluster.get("name") == cluster_name:
                          return session.get(f"{base}/clusters/{cluster['id']}", timeout=20).json()
                  return {}

              def ping_host(ip_addr):
                  result = subprocess.run(
                      ["ping", "-c", "1", "-W", "1", ip_addr],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  return result.returncode == 0

              def get_redfish_state(host):
                  bmc = f"mgmt-{host}"
                  state = {"host": host}
                  try:
                      system = session.get(
                          f"https://{bmc}/redfish/v1/Systems/System.Embedded.1",
                          auth=(bmc_user, bmc_password),
                          verify=False,
                          timeout=20,
                      ).json()
                      state["power_state"] = system.get("PowerState")
                      state["boot_progress"] = system.get("BootProgress")
                      state["boot_source_override_enabled"] = system.get("Boot", {}).get("BootSourceOverrideEnabled")
                      state["boot_source_override_target"] = system.get("Boot", {}).get("BootSourceOverrideTarget")
                  except Exception as exc:
                      state["system_error"] = repr(exc)
                  try:
                      virtual_media = session.get(
                          f"https://{bmc}/redfish/v1/Managers/iDRAC.Embedded.1/VirtualMedia/CD",
                          auth=(bmc_user, bmc_password),
                          verify=False,
                          timeout=20,
                      ).json()
                      state["virtual_media"] = {
                          "inserted": virtual_media.get("Inserted"),
                          "image": virtual_media.get("Image"),
                          "connected_via": virtual_media.get("ConnectedVia"),
                      }
                  except Exception as exc:
                      state["virtual_media_error"] = repr(exc)
                  return state

              def compact_redfish_state(state):
                  boot_progress = state.get("boot_progress") or {}
                  virtual_media = state.get("virtual_media") or {}
                  compact = {
                      "power_state": state.get("power_state"),
                      "boot_last_state": boot_progress.get("LastState"),
                      "boot_oem_last_state": boot_progress.get("OemLastState"),
                      "boot_source_override_enabled": state.get("boot_source_override_enabled"),
                      "boot_source_override_target": state.get("boot_source_override_target"),
                      "virtual_media_inserted": virtual_media.get("inserted"),
                      "virtual_media_connected_via": virtual_media.get("connected_via"),
                      "virtual_media_image": virtual_media.get("image"),
                  }
                  if state.get("system_error"):
                      compact["system_error"] = state["system_error"]
                  if state.get("virtual_media_error"):
                      compact["virtual_media_error"] = state["virtual_media_error"]
                  return compact

              def record_host_states(redfish_states, elapsed_seconds):
                  compact_states = {}
                  for item in redfish_states:
                      host = item["host"]
                      compact = compact_redfish_state(item)
                      compact_states[host] = compact
                      previous = monitor_summary["latest_host_states"].get(host)
                      if previous != compact:
                          history = monitor_summary["host_state_history"].setdefault(host, [])
                          history.append(
                              {
                                  "timestamp_epoch": time.time(),
                                  "elapsed_since_wait_seconds": round(elapsed_seconds, 1),
                                  "state": compact,
                              }
                          )
                          monitor_summary["host_state_history"][host] = history[-60:]
                          monitor_summary["latest_host_states"][host] = compact
                  return compact_states

              def write_monitor(summary):
                  with open(monitor_file, "w", encoding="utf-8") as fh2:
                      json.dump(summary, fh2, indent=2, sort_keys=True)

              while True:
                  rc = proc.poll()
                  log_text = read_log()
                  if wait_started_at is None and "Wait up to 40 min for nodes to be discovered" in log_text:
                      wait_started_at = time.time()
                      monitor_summary["wait_started_at_epoch"] = wait_started_at
                      write_monitor(monitor_summary)

                  if rc is not None:
                      monitor_summary["process_return_code"] = rc
                      monitor_summary["finished_at_epoch"] = time.time()
                      write_monitor(monitor_summary)
                      sys.exit(rc)

                  if wait_started_at is not None:
                      try:
                          cluster_detail = get_cluster_detail()
                      except Exception as exc:
                          cluster_detail = {"error": repr(exc)}

                      hosts_count = len(cluster_detail.get("hosts") or [])
                      ping_results = {}
                      for host in hosts:
                          ip_addr = controlplane_ips.get(host)
                          if ip_addr:
                              ping_results[host] = {"ip": ip_addr, "reachable": ping_host(ip_addr)}
                      redfish = [get_redfish_state(host) for host in hosts]
                      host_states = record_host_states(redfish, time.time() - wait_started_at)

                      snapshot = {
                          "timestamp_epoch": time.time(),
                          "elapsed_since_wait_seconds": round(time.time() - wait_started_at, 1),
                          "assisted_hosts_count": hosts_count,
                          "assisted_status": cluster_detail.get("status"),
                          "ping_results": ping_results,
                          "host_states": host_states,
                      }
                      monitor_summary["events"].append(snapshot)
                      monitor_summary["events"] = monitor_summary["events"][-20:]
                      write_monitor(monitor_summary)

                      elapsed = time.time() - wait_started_at
                      any_reachable = any(item.get("reachable") for item in ping_results.values())
                      if hosts_count == 0 and elapsed >= grace_seconds:
                          all_virtual_media_inserted = all(
                              (item.get("virtual_media") or {}).get("inserted") is True
                              for item in redfish
                          )
                          all_boot_override_consumed = all(
                              item.get("boot_source_override_enabled") == "Disabled"
                              for item in redfish
                          )
                          all_os_running = all(
                              (item.get("boot_progress") or {}).get("LastState") == "OSRunning"
                              for item in redfish
                          )
                          disk_fallback_detected = (
                              any_reachable and
                              all_virtual_media_inserted and
                              all_boot_override_consumed and
                              all_os_running
                          )
                          if not any_reachable:
                              failure_reason = "No hosts discovered and no control-plane IPs reachable after discovery grace period."
                          elif disk_fallback_detected:
                              failure_reason = (
                                  "No hosts were discovered even though control-plane IPs are reachable; "
                                  "the discovery ISO stayed mounted, but Dell one-time boot was consumed "
                                  "and the nodes are back in OSRunning instead of reaching Assisted Installer."
                              )
                          else:
                              failure_reason = ""

                          if failure_reason:
                              failure_summary = {
                                  "reason": failure_reason,
                                  "elapsed_since_wait_seconds": round(elapsed, 1),
                                  "assisted_cluster": {
                                      "status": cluster_detail.get("status"),
                                      "status_info": cluster_detail.get("status_info"),
                                      "hosts_count": hosts_count,
                                      "machine_networks": cluster_detail.get("machine_networks"),
                                  },
                                  "ping_results": ping_results,
                                  "redfish": redfish,
                              }
                              monitor_summary["failure"] = failure_summary
                              write_monitor(monitor_summary)
                              proc.terminate()
                              try:
                                  proc.wait(timeout=20)
                              except subprocess.TimeoutExpired:
                                  proc.kill()
                                  proc.wait(timeout=20)
                              print(json.dumps(failure_summary, indent=2))
                              sys.exit(42)

                  time.sleep(interval_seconds)
      register: jetlag_mno_deploy_result
      failed_when: false
      when: not (jetlag_setup_only | default(false) | bool)

